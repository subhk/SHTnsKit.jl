name: MPI Examples

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shtns37-mpi-cpu-parity:
    name: SHTns 3.7 MPI/CPU parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Instantiate MPI parity environment
        run: julia --project=. -e 'using Pkg; Pkg.add(["MPI", "PencilArrays", "PencilFFTs"]); Pkg.instantiate()'
      - name: Run two-rank MPI/CPU parity
        run: |
          julia --project=. -e '
            using MPI
            run(`$(MPI.mpiexec()) -n 2 $(Base.julia_cmd()) --project=. test/parity/runtests_mpi.jl`)
          '

  run-mpi-examples:
    name: Julia ${{ matrix.version }} - Ubuntu - MPI Examples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ['1']

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Install MPICH and FFTW
        run: |
          sudo apt-get update
          sudo apt-get install -y mpich libmpich-dev libfftw3-dev

      - name: Instantiate with MPI dependencies (system MPICH)
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add(["MPI","PencilArrays","PencilFFTs"])
            Pkg.resolve()
            ENV["JULIA_MPI_BINARY"] = "system"
            Pkg.build("MPI")
            Pkg.instantiate()
          '

      - name: Run parallel example (scalar)
        run: |
          julia --project=. -e '
            using MPI
            run(`$(MPI.mpiexec()) -n 2 $(Base.julia_cmd()) --project=. examples/parallel_roundtrip.jl`)
          '

      - name: Run parallel FFT example
        run: |
          julia --project=. -e '
            using MPI
            run(`$(MPI.mpiexec()) -n 2 $(Base.julia_cmd()) --project=. examples/parallel_fft_roundtrip.jl`)
          '
