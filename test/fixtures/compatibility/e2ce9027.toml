[baseline]
commit = "e2ce9027"
commit_full = "e2ce9027c94a40b29c6582bc0616d22e26a94ad7"
source_blob = "f5ec0b731b891260a4c44f94951ddf118086f44b"
export_count = 248
extraction = "Julia Meta.parseall traversal of export expressions in src/SHTnsKit.jl"

[[probe]]
id = "gauss_configuration_defaults"
signature = "create_gauss_config(lmax::Int, nlat::Int; ...)"
defaults = "mmax=lmax, mres=1, nlon=_default_nlon(lmax), norm=:orthonormal, cs_phase=true, real_norm=false, robert_form=false"
return_contract = "SHTConfig"

[[probe]]
id = "regular_configuration_defaults"
signature = "create_regular_config(lmax::Int, nlat::Int; ...)"
defaults = "mmax=lmax, mres=1, nlon=_default_nlon(lmax), norm=:orthonormal, cs_phase=true, real_norm=false, robert_form=false, include_poles=false, precompute_plm=true, use_dh_weights=false"
return_contract = "SHTConfig with regular grid"

[[probe]]
id = "scalar_transform_keywords"
signature = "analysis(cfg, field; fft_scratch=nothing, use_rfft=false); synthesis(cfg, coefficients; real_output=true, fft_scratch=nothing, use_rfft=false)"
defaults = "real synthesis, complex analysis coefficients, ordinary FFT path"
return_contract = "single matrix"

[[probe]]
id = "vector_transform_tuple_order"
signature = "synthesis_sphtor(cfg, S, T; real_output=true, use_rfft=false); analysis_sphtor(cfg, Vt, Vp; use_rfft=false)"
defaults = "real_output=true, use_rfft=false"
return_contract = "(Vt, Vp) and (S, T)"

[[probe]]
id = "qst_transform_tuple_order"
signature = "synthesis_qst(cfg, Q, S, T; real_output=true); analysis_qst(cfg, Vr, Vt, Vp)"
defaults = "real_output=true"
return_contract = "(Vr, Vt, Vp) and (Q, S, T)"

[[probe]]
id = "batch_transform_keywords"
signature = "analysis_batch(cfg, fields; use_rfft=false); synthesis_batch(cfg, coefficients; real_output=true, use_rfft=false)"
defaults = "real_output=true, use_rfft=false"
return_contract = "three-dimensional array"

[[probe]]
id = "packed_transform_signatures"
signature = "synthesis_packed(cfg, Qlm); analysis_packed(cfg, vec(field)); synthesis_point(cfg, Q, cost, phi)"
defaults = "none"
return_contract = "matrix, packed vector, scalar"

[[probe]]
id = "rotation_mutation_contract"
signature = "shtns_rotation_create(lmax, mmax, norm); shtns_rotation_set_angles_ZYZ(rotation, alpha, beta, gamma); shtns_rotation_apply_real(rotation, input, output)"
defaults = "none"
return_contract = "setter returns nothing; apply returns the supplied output"

[[probe]]
id = "device_value_first_order"
signature = "to_device(value::AbstractArray, device::ComputeDevice); to_device(value::AbstractArray)"
defaults = "to_device(value) uses get_device()"
return_contract = "CPU placement preserves an Array"
